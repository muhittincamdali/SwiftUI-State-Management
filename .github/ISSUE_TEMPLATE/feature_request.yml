name: Feature request
description: Suggest an API or an option for SwiftUIStateManagement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to build, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The API you would like
      description: A short code sample of how you would use it.
      render: swift
  - type: textarea
    id: alternatives
    attributes:
      label: What you use now
      description: Workarounds, plain @Observable models, or other packages you have tried.
