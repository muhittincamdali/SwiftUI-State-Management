name: Bug report
description: Something in SwiftUIStateManagement does not work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Code that shows it
      description: The smallest reducer, view or test that reproduces the problem.
      render: swift
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SwiftUIStateManagement version
      description: A release tag or a commit.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Xcode, Swift and OS versions
      description: For example "Xcode 27.1, Swift 6.4, iOS 27 simulator".
    validations:
      required: true
